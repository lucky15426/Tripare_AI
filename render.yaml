# Render Blueprint: backend side of StaySync (the frontend goes to Vercel, see vercel.json).
# Render dashboard -> New -> Blueprint -> pick this repo. Values marked "sync: false" are asked for at creation.
#
# NOTE: `worker` and `temporal` (private service) require a paid Render instance type; Render has no free tier for them.
# Temporal here is the single-binary dev server with in-memory history (it is lost on restart). That is acceptable
# because the hotel data lives in Redis; for durable history use Temporal Cloud instead (see README, Deployment).

services:
  - type: web
    name: staysync-api
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        sync: false # your Vercel URL, e.g. https://staysync.vercel.app (comma-separate several)
      - key: ENABLE_DEV_ENDPOINTS
        value: "false" # set "true" to enable the supplier-failure simulation buttons on a demo
      - key: REDIS_URL
        fromService: { type: keyvalue, name: staysync-redis, property: connectionString }
      - key: TEMPORAL_ADDRESS
        fromService: { type: pserv, name: staysync-temporal, property: hostport }
      - key: TEMPORAL_UI_URL
        value: https://cloud.temporal.io # no UI is hosted in this setup
      - key: SUPPLIER_A_URL
        sync: false # https://<your-api>.onrender.com/supplierA
      - key: SUPPLIER_B_URL
        sync: false # https://<your-api>.onrender.com/supplierB
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false

  - type: worker
    name: staysync-worker
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService: { type: keyvalue, name: staysync-redis, property: connectionString }
      - key: TEMPORAL_ADDRESS
        fromService: { type: pserv, name: staysync-temporal, property: hostport }
      - key: SUPPLIER_A_URL
        sync: false # same values as the API
      - key: SUPPLIER_B_URL
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false

  - type: pserv
    name: staysync-temporal
    runtime: image
    image:
      url: docker.io/temporalio/temporal:latest
    dockerCommand: temporal server start-dev --ip 0.0.0.0 --port 7233 --headless
    plan: starter

  - type: keyvalue
    name: staysync-redis
    plan: free
    ipAllowList: [] # private network only
    maxmemoryPolicy: allkeys-lru
