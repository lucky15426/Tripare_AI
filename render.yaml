# Render Blueprint: the WHOLE backend as ONE web service + Redis. (The frontend goes to Vercel, see vercel.json.)
#
# The single service runs the API, the mock suppliers, a real Temporal dev server and the Temporal worker in one
# process (EMBEDDED_TEMPORAL=true). Temporal's workflow history is kept in memory and resets on restart; all hotel
# data lives in Redis. For durable history use Temporal Cloud instead (see README, "Deploy").

services:
  - type: web
    name: staysync-api
    runtime: node
    plan: starter # free works too but sleeps when idle, and the first request after a sleep takes ~1 minute
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: EMBEDDED_TEMPORAL
        value: "true"
      - key: REDIS_URL
        fromService: { type: keyvalue, name: staysync-redis, property: connectionString }
      - key: CORS_ORIGIN
        sync: false # your Vercel URL, e.g. https://staysync.vercel.app (optional: defaults to any origin)
      - key: ENABLE_DEV_ENDPOINTS
        value: "false" # "true" enables the supplier-failure simulation buttons
      - key: OPENWEATHER_API_KEY
        sync: false # optional
      - key: GEOAPIFY_API_KEY
        sync: false # optional

  - type: keyvalue
    name: staysync-redis
    plan: free
    ipAllowList: [] # private network only
    maxmemoryPolicy: allkeys-lru
